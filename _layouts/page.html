---
layout: default
---
<section class="page-head">
  <div class="wrap">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</section>
<section class="wrap page-body {% if page.narrow %}narrow{% endif %}">
  {{ content }}
</section>
