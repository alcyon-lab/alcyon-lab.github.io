<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="logo logo-light" src="{{ '/assets/img/logo/alcyon-logo.png' | relative_url }}" alt="" width="46" height="43"><img class="logo logo-dark" src="{{ '/assets/img/logo/alcyon-logo-dark.png' | relative_url }}" alt="" width="46" height="43">
      <span class="brand-text">
        <span class="brand-name">ALCYON</span>
        <span class="brand-nodes node-order"><span class="node-athens"><span class="dot athens"></span>Athens</span><span class="sep">·</span><span class="node-istanbul"><span class="dot istanbul"></span>Istanbul</span></span>
      </span>
    </a>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark background" title="Light / dark">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
    </button>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
