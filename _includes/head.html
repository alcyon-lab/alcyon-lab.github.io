<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
  // Apply a saved light/dark choice before the page paints
  try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  // Show Athens or Istanbul first at random, keeping the same order for the rest of the visit
  (function () {
    var first;
    try { first = sessionStorage.getItem('first-node'); } catch (e) {}
    if (first !== 'athens' && first !== 'istanbul') {
      first = Math.random() < 0.5 ? 'athens' : 'istanbul';
      try { sessionStorage.setItem('first-node', first); } catch (e) {}
    }
    document.documentElement.dataset.first = first;
  })();
</script>
{% seo title=false %}
<title>{% if page.name and page.layout == "member" %}{{ page.name }} · {% elsif page.title and page.url != "/" %}{{ page.title | strip_html }} · {% endif %}{{ site.title }} lab</title>
<link rel="icon" type="image/png" href="{{ '/assets/img/logo/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/logo/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% feed_meta %}
{% if page.math %}
<script>window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
{% endif %}
