# ALCYON lab — Athens · Istanbul
# After editing this file, restart `jekyll serve`.

title: ALCYON
tagline: Algorithms for Combinatorics, Geometry, Optimization and Number theory
description: >-
  ALCYON is a symbolic computation lab with two nodes, in Athens and Istanbul,
  working on algorithms for combinatorics, geometry, optimization and number theory.
url: "https://alcyon-lab.github.io"
baseurl: ""
lang: en

email: alcyon.lab@gmail.com
# Publications before this year are kept in _publications/ but not shown
publications_from: 2016

# News older than this date moves from Activities to the Old news page
old_news_before: 2025-01-01

join_form: https://forms.gle/FrDxYuaX18j63T1r7
social:
  twitter: alcyonlab
  linkedin: groups/8811634/
  scholar: https://scholar.google.com/citations?user=NEeNVssAAAAJ&hl=en
  github: alcyon-lab

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  members:
    output: true
    permalink: /people/:name/
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: false
  software:
    output: false
  news:
    output: false
  topics:
    output: true
    permalink: /topics/:name/

defaults:
  - scope: { path: "", type: members }
    values: { layout: member }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: topics }
    values: { layout: topic, math: true }
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _migration
