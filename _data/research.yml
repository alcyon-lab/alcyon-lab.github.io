# Research directions
areas:
  - title: Computer Algebra
    icon: "∑"
    text: Algorithmic methods in commutative algebra. In recent years we have studied resultant systems in detail.
  - title: Effective Algebraic Geometry
    icon: "∿"
    text: Singularities, real solving and the algorithmic tools needed to explore them, such as Hermite matrices and their signatures.
  - title: Optimization
    icon: "↗"
    text: Integer linear optimization. We use Polyhedral Omega to solve ILPs, and ILP to improve polynomial multiplication algorithms.
  - title: Polyhedral Geometry
    icon: "◇"
    text: Efficient algorithms for polytopes and cones, and polyhedral methods that speed up algorithms in other fields such as combinatorics.
  - title: Number Theory
    icon: "ℕ"
    text: Mostly integer partitions. This area poses many computational challenges and also supplies beautiful algorithmic tools.
